<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Scratch チャット</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="chat">
      <header class="chat-header">
        <div class="brand">
          <img class="brand-mark" src="/scratch-icon.svg" alt="">
          <div>
            <h1>Scratch チャット</h1>
            <p class="subtitle">気軽に話そう、リアルタイムで。</p>
          </div>
        </div>
        <div class="connection-info">
          <span class="connection-status" id="connection-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connection-label">接続中...</span>
          </span>
          <span class="participant-count" id="participant-count">参加者 -- 人</span>
        </div>
      </header>

      <section class="conversation" aria-label="チャットメッセージ" aria-live="polite">
        <div class="messages" id="messages">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon" aria-hidden="true">✦</div>
            <p>会話を始めましょう</p>
            <span>最初のメッセージを送ってみてください。</span>
          </div>
        </div>
      </section>

      <form class="composer" id="chat-form">
        <div class="composer-top">
          <label class="name-field">
            <span>お名前</span>
            <input id="name-input" name="name" maxlength="24" autocomplete="nickname" value="ゲスト">
          </label>
          <fieldset class="color-picker">
            <legend>メッセージの色</legend>
            <div class="color-options" id="color-options"></div>
          </fieldset>
        </div>
        <div class="input-row">
          <label class="visually-hidden" for="message-input">メッセージ</label>
          <input
            id="message-input"
            name="message"
            maxlength="500"
            placeholder="メッセージを入力..."
            autocomplete="off"
            required
          >
          <button class="send-button" id="send-button" type="submit" aria-label="メッセージを送信">
            <span>送信</span>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 10h13M10 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="composer-hint">Enter キーで送信できます</p>
      </form>
    </main>
    <div class="lock-screen" id="lock-screen" role="img" aria-label="管理者によりアクセスができません" tabindex="-1" hidden>
      <img src="/lock-screen.svg" alt="">
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
