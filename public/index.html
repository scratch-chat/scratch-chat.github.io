<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Scratch チャット</title>
    <style>
:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
  color: #24252b;
  background: #fff;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  font-weight: 400;
}

* {
  box-sizing: border-box;
}

html {
  height: 100%;
  overflow: hidden;
}

body {
  min-width: 320px;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: #fff;
}

button,
input {
  font: inherit;
}

.chat {
  display: flex;
  width: min(100%, 900px);
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  flex-direction: column;
  margin: 0 auto;
  overflow: hidden;
  background: #fff;
}

.lock-screen {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #fff;
}

.lock-screen[hidden] {
  display: none;
}

.lock-screen img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.chat-header {
  display: flex;
  flex: 0 0 auto;
  min-height: 88px;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 30px;
  border-bottom: 1px solid #f0f0f2;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  display: block;
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  border-radius: 11px;
  object-fit: contain;
}

h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.subtitle {
  margin: 4px 0 0;
  color: #96969f;
  font-size: 12px;
}

.connection-info {
  display: flex;
  align-items: flex-end;
  flex-direction: column;
  gap: 6px;
  color: #8d8d96;
  font-size: 11px;
}

.connection-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #85858e;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e4a344;
}

.connection-status.is-connected .status-dot {
  background: #53b889;
}

.connection-status.is-disconnected .status-dot {
  background: #e46b6b;
}

.participant-count {
  color: #a0a0a8;
}

.conversation {
  display: flex;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.messages {
  display: flex;
  width: 100%;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  gap: 18px;
  overflow-y: auto;
  padding: 28px 30px;
}

.empty-state {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #a0a0a8;
  text-align: center;
}

.empty-icon {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  margin-bottom: 12px;
  border-radius: 50%;
  background: #f7f5ff;
  color: #8d73dc;
  font-size: 20px;
}

.empty-state p {
  margin: 0 0 6px;
  color: #5a5a64;
  font-size: 14px;
  font-weight: 600;
}

.empty-state span {
  font-size: 12px;
}

.message {
  max-width: min(76%, 560px);
  align-self: flex-start;
  animation: appear 180ms ease-out;
}

.message-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px 3px;
  color: #8d8d96;
  font-size: 11px;
}

.message-name {
  color: #55555f;
  font-weight: 600;
}

.delete-message-button {
  padding: 2px 6px;
  border: 0;
  background: transparent;
  color: #a66;
  font-size: 10px;
  cursor: pointer;
}

.reply-message-button {
  margin-left: auto;
  padding: 2px 6px;
  border: 0;
  background: transparent;
  color: #777783;
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}

.reply-quote {
  max-width: 100%;
  margin: 0 0 6px 3px;
  padding-left: 8px;
  border-left: 2px solid #c8bee9;
  color: #777783;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.message-reactions {
  display: flex;
  gap: 6px;
  margin: 7px 0 0 3px;
}

.reaction-button {
  display: inline-flex;
  min-width: 42px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 3px 8px;
  border: 1px solid #ededf0;
  border-radius: 999px;
  background: #fff;
  color: #666671;
  font-size: 11px;
  cursor: pointer;
}

.reaction-button[aria-pressed="true"] {
  border-color: #f2cbd5;
  background: #fff5f7;
}

.reaction-button[data-reaction="star"][aria-pressed="true"] {
  border-color: #efdfa8;
  background: #fffbee;
}

.message-bubble {
  padding: 11px 15px;
  border: 1px solid #f0f0f2;
  border-radius: 4px 16px 16px;
  background: #fafafd;
  color: #24252b;
  font-size: 14px;
  line-height: 1.65;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.composer {
  flex: 0 0 auto;
  padding: 18px 30px calc(20px + env(safe-area-inset-bottom));
  border-top: 1px solid #f0f0f2;
}

.composer-top {
  display: flex;
  min-height: 44px;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 11px;
}

.reply-preview {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  padding: 7px 10px;
  border-left: 3px solid #b7a9ef;
  border-radius: 6px;
  background: #f8f6ff;
  color: #666671;
  font-size: 11px;
}

.reply-preview[hidden] {
  display: none;
}

.reply-preview-text {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reply-cancel-button {
  padding: 2px 6px;
  border: 0;
  background: transparent;
  color: #777783;
  font-size: 11px;
  cursor: pointer;
}

.name-field {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #898992;
  font-size: 11px;
}

.name-field input {
  width: 130px;
  padding: 7px 10px;
  border: 1px solid #ededf0;
  border-radius: 8px;
  outline: none;
  color: #45454f;
  font-size: 12px;
}

.name-field input:focus,
.input-row input:focus {
  border-color: #b7a9ef;
}

.color-picker {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  padding: 0;
  border: 0;
}

.color-picker legend {
  float: left;
  margin-right: 12px;
  color: #898992;
  font-size: 11px;
}

.color-options {
  display: flex;
  align-items: center;
  gap: 9px;
}

.color-option {
  position: relative;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #e6e6e9;
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease;
}

.color-option:hover {
  transform: scale(1.12);
}

.color-option[aria-checked="true"] {
  box-shadow: 0 0 0 2px #4e4d59;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.input-row input {
  width: 100%;
  min-width: 0;
  height: 48px;
  padding: 0 15px;
  border: 1px solid #eaeaf0;
  border-radius: 13px;
  outline: none;
  background: #fff;
  color: #34343d;
  font-size: 13px;
  transition: border-color 120ms ease;
}

.input-row input::placeholder {
  color: #b1b1b8;
}

.send-button {
  display: inline-flex;
  height: 46px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 17px;
  border: 0;
  border-radius: 12px;
  background: #7658d6;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 120ms ease, transform 120ms ease;
}

.send-button:hover {
  transform: translateY(-1px);
  background: #694bc8;
}

.send-button:disabled {
  background: #b9b0d7;
  cursor: not-allowed;
  transform: none;
}

.send-button svg {
  width: 16px;
  height: 16px;
}

.composer-hint {
  margin: 9px 0 0 2px;
  color: #b0b0b7;
  font-size: 10px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  clip-path: inset(50%);
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 560px) {
  .chat-header {
    min-height: 76px;
    padding: 14px 18px;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
  }

  .subtitle {
    font-size: 10px;
  }

  .connection-info {
    font-size: 10px;
  }

  .messages {
    padding: 22px 18px;
  }

  .composer {
    padding: 15px 18px calc(18px + env(safe-area-inset-bottom));
  }

  .composer-top {
    align-items: flex-start;
    flex-direction: column;
    gap: 13px;
    margin-bottom: 12px;
  }

  .color-picker legend {
    float: none;
    margin-right: 10px;
  }

  .color-picker {
    gap: 0;
  }

  .message {
    max-width: 88%;
  }
}

    </style>

    <script>
window.CHAT_WEBSOCKET_URL = window.location.hostname === "scratch-chat.github.io"
  ? "wss://studious-tribble-q79q5qrprrrqcx7wv-8000.app.github.dev/ws"
  : "";

const COLORS = [
  { value: "#fffafa", swatch: "#ffd6d6", label: "赤" },
  { value: "#fffbf5", swatch: "#ffe2b8", label: "オレンジ" },
  { value: "#f8fcf8", swatch: "#d6f2df", label: "緑" },
  { value: "#f7faff", swatch: "#d6e8ff", label: "青" },
  { value: "#fbf9ff", swatch: "#e8dcff", label: "紫" },
];

const OWNER_TOKEN_KEY = "scratch-chat-owner-token";
const OWNER_TOKEN_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
let ownerToken = window.localStorage.getItem(OWNER_TOKEN_KEY);
if (!OWNER_TOKEN_PATTERN.test(ownerToken || "")) {
  ownerToken = window.crypto.randomUUID();
  window.localStorage.setItem(OWNER_TOKEN_KEY, ownerToken);
}

const messagesElement = document.querySelector("#messages");
const emptyState = document.querySelector("#empty-state");
const colorOptions = document.querySelector("#color-options");
const form = document.querySelector("#chat-form");
const messageInput = document.querySelector("#message-input");
const nameInput = document.querySelector("#name-input");
const sendButton = document.querySelector("#send-button");
const replyPreview = document.querySelector("#reply-preview");
const replyPreviewText = document.querySelector("#reply-preview-text");
const replyCancelButton = document.querySelector("#reply-cancel-button");
const connectionStatus = document.querySelector("#connection-status");
const connectionLabel = document.querySelector("#connection-label");
const participantCount = document.querySelector("#participant-count");
const lockScreen = document.querySelector("#lock-screen");

let selectedColor = COLORS[3].value;
let socket;
let reconnectDelay = 1000;
let enteredDigits = "";
let replyTo = null;

function createColorOptions() {
  for (const color of COLORS) {
    const button = document.createElement("button");
    button.className = "color-option";
    button.type = "button";
    button.style.backgroundColor = color.swatch;
    button.setAttribute("role", "radio");
    button.setAttribute("aria-label", color.label);
    button.setAttribute("aria-checked", String(color.value === selectedColor));
    button.title = `${color.label}を選択`;
    button.addEventListener("click", () => {
      selectedColor = color.value;
      for (const option of colorOptions.children) {
        option.setAttribute("aria-checked", String(option === button));
      }
      messageInput.focus();
    });
    colorOptions.append(button);
  }
}

function appendMessage(message) {
  emptyState?.remove();

  const item = document.createElement("article");
  item.className = "message";
  item.dataset.messageId = message.id;

  const meta = document.createElement("div");
  meta.className = "message-meta";

  const name = document.createElement("span");
  name.className = "message-name";
  name.textContent = message.name;

  const time = document.createElement("time");
  time.dateTime = new Date(message.timestamp).toISOString();
  time.textContent = new Intl.DateTimeFormat("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
  }).format(message.timestamp);

  const bubble = document.createElement("div");
  bubble.className = "message-bubble";
  bubble.style.backgroundColor = message.color;
  bubble.textContent = message.text;

  meta.append(name, time);
  const replyButton = document.createElement("button");
  replyButton.className = "reply-message-button";
  replyButton.type = "button";
  replyButton.textContent = "↩";
  replyButton.setAttribute("aria-label", `${message.name}に返信`);
  replyButton.addEventListener("click", () => {
    setReplyTo(message);
  });
  meta.append(replyButton);

  if (message.canDelete) {
    const deleteButton = document.createElement("button");
    deleteButton.className = "delete-message-button";
    deleteButton.type = "button";
    deleteButton.textContent = "削除";
    deleteButton.setAttribute("aria-label", `${message.name}のメッセージを削除`);
    deleteButton.addEventListener("click", () => {
      if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "delete_message", id: message.id }));
      }
    });
    meta.append(deleteButton);
  }

  item.append(meta);
  if (message.reply) {
    const replyQuote = document.createElement("div");
    replyQuote.className = "reply-quote";
    replyQuote.textContent = `返信先 ${message.reply.name}: ${message.reply.text}`;
    item.append(replyQuote);
  }
  item.append(bubble);

  const reactionBar = document.createElement("div");
  reactionBar.className = "message-reactions";
  const reactionCounts = message.reactions || { heart: 0, star: 0 };
  const myReactions = message.myReactions || { heart: false, star: false };
  for (const reaction of [
    { key: "heart", icon: "❤️", label: "ハート" },
    { key: "star", icon: "⭐", label: "星" },
  ]) {
    const button = document.createElement("button");
    button.className = "reaction-button";
    button.dataset.reaction = reaction.key;
    button.type = "button";
    button.setAttribute("aria-label", `${reaction.label}でリアクション`);
    button.setAttribute("aria-pressed", String(Boolean(myReactions[reaction.key])));
    const count = document.createElement("span");
    count.className = "reaction-count";
    count.textContent = String(reactionCounts[reaction.key] || 0);
    button.append(document.createTextNode(reaction.icon), count);
    button.addEventListener("click", () => {
      if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: "reaction",
          id: message.id,
          reaction: reaction.key,
        }));
      }
    });
    reactionBar.append(button);
  }
  item.append(reactionBar);
  messagesElement.append(item);
  messagesElement.scrollTop = messagesElement.scrollHeight;
}

function setReplyTo(message) {
  replyTo = { id: message.id, name: message.name, text: message.text };
  replyPreviewText.textContent = `返信先 ${message.name}: ${message.text}`;
  replyPreviewText.title = replyPreviewText.textContent;
  replyPreview.hidden = false;
  messageInput.focus();
}

function clearReply() {
  replyTo = null;
  replyPreviewText.textContent = "";
  replyPreviewText.title = "";
  replyPreview.hidden = true;
}

function removeMessage(messageId) {
  if (replyTo?.id === messageId) {
    clearReply();
  }
  for (const item of messagesElement.querySelectorAll(".message")) {
    if (item.dataset.messageId === messageId) {
      item.remove();
      break;
    }
  }
  if (!messagesElement.querySelector(".message") && emptyState && emptyState.parentElement !== messagesElement) {
    messagesElement.append(emptyState);
  }
}

function clearMessages() {
  clearReply();
  for (const item of messagesElement.querySelectorAll(".message")) {
    item.remove();
  }
  if (emptyState && emptyState.parentElement !== messagesElement) {
    messagesElement.append(emptyState);
  }
}

function updateReactions(payload) {
  const item = [...messagesElement.querySelectorAll(".message")]
    .find((message) => message.dataset.messageId === payload.id);
  if (!item) {
    return;
  }

  for (const button of item.querySelectorAll(".reaction-button")) {
    const reaction = button.dataset.reaction;
    button.querySelector(".reaction-count").textContent = String(payload.reactions[reaction]);
    button.setAttribute("aria-pressed", String(payload.myReactions[reaction]));
  }
}

function setConnected(connected) {
  connectionStatus.classList.toggle("is-connected", connected);
  connectionStatus.classList.toggle("is-disconnected", !connected);
  connectionLabel.textContent = connected ? "オンライン" : "再接続中...";
  sendButton.disabled = !connected;
}

function connect() {
  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const socketUrl = window.CHAT_WEBSOCKET_URL || `${protocol}//${window.location.host}/ws`;
  socket = new WebSocket(socketUrl);
  setConnected(false);

  socket.addEventListener("open", () => {
    reconnectDelay = 1000;
    socket.send(JSON.stringify({ type: "identify", token: ownerToken }));
    setConnected(true);
  });

  socket.addEventListener("message", (event) => {
    let payload;
    try {
      payload = JSON.parse(event.data);
    } catch {
      return;
    }

    if (payload.type === "init") {
      participantCount.textContent = `参加者 ${payload.participants} 人`;
      setLockState(payload.locked);
      for (const message of payload.messages) {
        appendMessage(message);
      }
    } else if (payload.type === "participants") {
      participantCount.textContent = `参加者 ${payload.count} 人`;
    } else if (payload.type === "message") {
      appendMessage(payload);
    } else if (payload.type === "message_deleted") {
      removeMessage(payload.id);
    } else if (payload.type === "messages_cleared") {
      clearMessages();
    } else if (payload.type === "reaction_update") {
      updateReactions(payload);
    } else if (payload.type === "lock_state") {
      setLockState(payload.locked);
    }
  });

  socket.addEventListener("close", () => {
    setConnected(false);
    window.setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  });

  socket.addEventListener("error", () => {
    socket.close();
  });
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = messageInput.value.trim();
  if (!text || socket?.readyState !== WebSocket.OPEN) {
    return;
  }

  socket.send(JSON.stringify({
    type: "message",
    name: nameInput.value.trim() || "ゲスト",
    text,
    color: selectedColor,
    replyToId: replyTo?.id || null,
  }));
  messageInput.value = "";
  clearReply();
  messageInput.focus();
});

replyCancelButton.addEventListener("click", clearReply);

document.addEventListener("keydown", (event) => {
  const target = event.target;
  if (
    event.isComposing
    || event.repeat
    || event.ctrlKey
    || event.altKey
    || event.metaKey
    || (target instanceof Element && target.closest("input, textarea, select, [contenteditable='true']"))
  ) {
    enteredDigits = "";
    return;
  }

  if (!/^\d$/.test(event.key)) {
    enteredDigits = "";
    return;
  }

  enteredDigits = `${enteredDigits}${event.key}`.slice(-4);
  if (enteredDigits === "6780" || enteredDigits === "8880") {
    const type = enteredDigits === "6780" ? "admin_lock" : "reset_chat";
    enteredDigits = "";
    if (socket?.readyState !== WebSocket.OPEN) {
      return;
    }

    socket.send(JSON.stringify({ type }));
  }
});

function setLockState(locked) {
  if (typeof locked !== "boolean") {
    return;
  }
  lockScreen.hidden = !locked;
  if (locked) {
    document.activeElement?.blur();
    lockScreen.focus();
  }
}

createColorOptions();
connect();

    </script>
  </body>
